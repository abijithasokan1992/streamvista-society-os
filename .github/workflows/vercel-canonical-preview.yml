name: society-os-canonical-vercel-preview

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PREVIEW to deploy the exact selected commit to the one configured canonical Vercel project.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prebuilt-preview:
    if: ${{ inputs.confirm == 'PREVIEW' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify canonical deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN is missing'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'VERCEL_ORG_ID is missing'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'VERCEL_PROJECT_ID is missing'; exit 1; }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Pull canonical Vercel project settings
        run: npx --yes vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
      - name: Build on GitHub runner
        run: npx --yes vercel@latest build --token "$VERCEL_TOKEN"
      - name: Deploy prebuilt preview only
        run: npx --yes vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN"
